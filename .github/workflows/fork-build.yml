# GitHub Actions replacement for the former Jenkinsfile.talend (shared-lib step `Fork`):
#   Package distribution -> Sanity check (manual approval) -> Deploy distribution.
# Deployment never runs for pull requests: it needs a manual workflow_dispatch with `deploy` ticked,
# plus approval on the `global-artifacts-deploy` environment.
# Packages are read from / published to GitHub Packages (Talend/global-artifacts) with the workflow GITHUB_TOKEN:
# the repository must be granted access in the package settings of global-artifacts (read for build, write for deploy).
name: Fork build

on:
  push:
    branches: ['tesb/**', 'maintenance/**']
  pull_request:
  workflow_dispatch:
    inputs:
      mvn_modules:
        description: 'Modules to build (default: MVN_MODULES below)'
        required: false
        type: string
      deploy:
        description: 'Deploy to global-artifacts after the build (needs approval on the environment)'
        required: false
        default: false
        type: boolean
      deploy_goal:
        description: 'Maven deploy goal'
        required: false
        default: deploy
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

env:
  MVN_MODULES: ':karaf-bom,org.apache.karaf:org.apache.karaf.util,org.apache.karaf.bundle:org.apache.karaf.bundle.core,org.apache.karaf.config:org.apache.karaf.config.command,org.apache.karaf.config:org.apache.karaf.config.core,org.apache.karaf.deployer:org.apache.karaf.deployer.blueprint,org.apache.karaf.deployer:org.apache.karaf.deployer.features,org.apache.karaf.deployer:org.apache.karaf.deployer.wrap,org.apache.karaf.diagnostic:org.apache.karaf.diagnostic.core,org.apache.karaf.docker:org.apache.karaf.docker.core,org.apache.karaf.features:org.apache.karaf.features.core,org.apache.karaf.instance:org.apache.karaf.instance.core,org.apache.karaf.jaas:org.apache.karaf.jaas.modules,org.apache.karaf.jdbc:org.apache.karaf.jdbc.core,org.apache.karaf.jms:org.apache.karaf.jms.core,org.apache.karaf.kar:org.apache.karaf.kar.core,org.apache.karaf.maven:org.apache.karaf.maven.core,org.apache.karaf.package:org.apache.karaf.package.core,org.apache.karaf.profile:org.apache.karaf.profile.core,org.apache.karaf.shell:org.apache.karaf.shell.commands,org.apache.karaf.shell:org.apache.karaf.shell.console,org.apache.karaf.shell:org.apache.karaf.shell.core,org.apache.karaf.shell:org.apache.karaf.shell.ssh,org.apache.karaf.system:org.apache.karaf.system.core,org.apache.karaf.wrapper:org.apache.karaf.wrapper.core,org.apache.karaf:org.apache.karaf.main,org.apache.karaf:org.apache.karaf.client,org.apache.karaf.features:base,org.apache.karaf.features:specs,org.apache.karaf.features:framework,org.apache.karaf.features:standard,org.apache.karaf.features:enterprise,org.apache.karaf.features:spring,org.apache.karaf.features:spring-legacy,org.apache.karaf.jaas:org.apache.karaf.jaas.spring-security-crypto,org.apache.karaf.http:org.apache.karaf.http.core,org.apache.karaf.web:org.apache.karaf.web.core,org.apache.karaf.webconsole:org.apache.karaf.webconsole.console,org.apache.karaf.webconsole:org.apache.karaf.webconsole.features,org.apache.karaf.webconsole:org.apache.karaf.webconsole.gogo,org.apache.karaf.webconsole:org.apache.karaf.webconsole.http,org.apache.karaf.webconsole:org.apache.karaf.webconsole.instance'
  GITHUB_ACTOR: ${{ github.actor }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  GLOBAL_ARTIFACTS_URL: https://maven.pkg.github.com/Talend/global-artifacts
  MAVEN_CUSTOM_OPTIONS: >-
    -U -B
    -DaltReleaseDeploymentRepository=global-artifacts::default::https://maven.pkg.github.com/Talend/global-artifacts
    -DaltSnapshotDeploymentRepository=global-artifacts::default::https://maven.pkg.github.com/Talend/global-artifacts
    -Dorg.slf4j.simpleLogger.showDateTime=true -Dorg.slf4j.simpleLogger.dateTimeFormat=HH:mm:ss,SSS

jobs:
  build:
    name: Package distribution
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      modules: ${{ steps.modules.outputs.modules }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          # writes ~/.m2/settings.xml with the `global-artifacts` server (same id as the repository in the poms)
          server-id: global-artifacts
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Resolve MVN_MODULES
        id: modules
        env:
          INPUT_MODULES: ${{ inputs.mvn_modules }}
        run: echo "modules=${INPUT_MODULES:-$MVN_MODULES}" >> "$GITHUB_OUTPUT"

      - name: mvn install
        env:
          MVN_MODULES: ${{ steps.modules.outputs.modules }}
        run: |
          mvn --version
          if [ "$MVN_MODULES" = "ALL" ]; then
            mvn install $MAVEN_CUSTOM_OPTIONS -DskipTests -Dmaven.test.skip.exec=true
          else
            mvn install $MAVEN_CUSTOM_OPTIONS -pl "$MVN_MODULES" -DskipTests
          fi

  deploy:
    name: Deploy distribution
    needs: build
    # Jenkins: `input 'Do you want to proceed to the Deployment?'`. Here: required reviewers on the
    # `global-artifacts-deploy` environment (Settings > Environments). Never on pull requests.
    if: github.event_name == 'workflow_dispatch' && inputs.deploy && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: global-artifacts-deploy
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          server-id: global-artifacts
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: mvn deploy
        env:
          MVN_MODULES: ${{ needs.build.outputs.modules }}
          MVN_DEPLOY_GOAL: ${{ inputs.deploy_goal }}
        run: |
          if [ "$MVN_MODULES" = "ALL" ]; then
            mvn "$MVN_DEPLOY_GOAL" $MAVEN_CUSTOM_OPTIONS -DskipTests -Dmaven.test.skip.exec=true
          else
            mvn "$MVN_DEPLOY_GOAL" $MAVEN_CUSTOM_OPTIONS -pl "$MVN_MODULES" -DskipTests
          fi

  notify:
    name: Slack notification
    needs: [build, deploy]
    if: always() && github.event_name != 'pull_request' && needs.build.result != 'skipped'
    runs-on: ubuntu-latest
    steps:
      - name: Slack
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          RESULT: ${{ contains(needs.*.result, 'failure') && 'FAILURE' || contains(needs.*.result, 'cancelled') && 'ABORTED' || 'SUCCESS' }}
        run: |
          [ -n "$SLACK_WEBHOOK_URL" ] || { echo "SLACK_WEBHOOK_URL not set, skipping"; exit 0; }
          curl -sf -X POST -H 'Content-type: application/json' \
            --data "{\"text\":\"FORK ${GITHUB_REPOSITORY} ${RESULT} (<${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}|#${GITHUB_RUN_NUMBER}> | ${GITHUB_REF_NAME})\"}" \
            "$SLACK_WEBHOOK_URL"
